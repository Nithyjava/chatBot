[project]
name = "skatchatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nithyanandha-skat", email = "nithyananthana@skattech.com" }
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "pymongo>=4.18.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
skatchatbot = "skatchatbot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
